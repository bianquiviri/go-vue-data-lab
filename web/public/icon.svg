<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Go Data Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Data bars (concurrent processing) -->
  <g fill="url(#accent)">
    <rect x="120" y="300" width="48" height="92" rx="12"/>
    <rect x="184" y="252" width="48" height="140" rx="12"/>
    <rect x="248" y="204" width="48" height="188" rx="12"/>
    <rect x="312" y="156" width="48" height="236" rx="12"/>
  </g>

  <!-- Connection nodes (channels / goroutines) -->
  <g fill="#e2e8f0">
    <circle cx="144" cy="300" r="14"/>
    <circle cx="208" cy="252" r="14"/>
    <circle cx="272" cy="204" r="14"/>
    <circle cx="336" cy="156" r="14"/>
  </g>

  <!-- Baseline -->
  <rect x="120" y="392" width="240" height="16" rx="8" fill="#334155"/>
</svg>
