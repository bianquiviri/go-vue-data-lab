<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Data Lab</title>
    <script>
      // Anti-flash de tema: aplica Claro/Oscuro antes del primer paint usando
      // la misma clave que stores/theme.ts (gdl.theme).
      (function () {
        try {
          var mode = null
          var stored = window.localStorage.getItem('gdl.theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            mode = stored === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : stored
          } else {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (mode === 'dark') {
            document.documentElement.classList.add('dark')
          }
          document.documentElement.style.colorScheme = mode
        } catch (e) {
          // localStorage no disponible: se queda en el tema claro por defecto
        }
      })()
    </script>
    <script>
      // Anti-flash de idioma: fija <html lang> antes del primer paint con la
      // misma clave y la misma detección que i18n/index.ts (gdl.locale).
      (function () {
        try {
          var stored = window.localStorage.getItem('gdl.locale')
          var locale = null
          if (stored === 'es' || stored === 'en') {
            locale = stored
          } else {
            var language = (navigator.language || '').toLowerCase()
            locale = language.indexOf('es') === 0 ? 'es' : 'en'
          }
          document.documentElement.lang = locale
        } catch (e) {
          // localStorage no disponible: se queda con el lang por defecto (en)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
