basePath: /api/v1
definitions:
  handler.AdminStatsEnvelope:
    properties:
      data:
        $ref: '#/definitions/service.AdminStatsSnapshot'
    type: object
  handler.AdminUserEnvelope:
    properties:
      data:
        $ref: '#/definitions/models.User'
    type: object
  handler.AdminUserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.User'
        type: array
      meta:
        $ref: '#/definitions/handler.PageMeta'
    type: object
  handler.AnalyticsListResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/handler.LimitMeta'
    type: object
  handler.DataResponse:
    properties:
      data: {}
    type: object
  handler.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
    type: object
  handler.HealthResponse:
    properties:
      status:
        type: string
      time:
        type: string
      version:
        type: string
    type: object
  handler.JobProgressEnvelope:
    properties:
      data:
        $ref: '#/definitions/jobs.Progress'
    type: object
  handler.JobStartEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.JobStartResponse'
    type: object
  handler.JobStartResponse:
    properties:
      job_id:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  handler.JobStatusEnvelope:
    properties:
      data:
        $ref: '#/definitions/jobs.JobStatus'
    type: object
  handler.JobStopEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.JobStopResponse'
    type: object
  handler.JobStopResponse:
    properties:
      stopped:
        type: boolean
    type: object
  handler.LimitMeta:
    properties:
      limit:
        type: integer
    type: object
  handler.OrderCreateRequest:
    properties:
      currency:
        type: string
      customer_id:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.OrderItemRequest'
        type: array
      order_date:
        type: string
      order_number:
        type: string
      shipping_address:
        type: object
      status:
        type: string
    required:
    - customer_id
    type: object
  handler.OrderItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
      unit_price:
        minimum: 0
        type: number
    required:
    - product_id
    type: object
  handler.PageMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handler.PaginatedResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/handler.PageMeta'
    type: object
  handler.ScheduleEnvelope:
    properties:
      data:
        $ref: '#/definitions/models.CronSchedule'
    type: object
  handler.ScheduleListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/models.CronSchedule'
        type: array
    type: object
  handler.ScheduleRunEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.ScheduleRunResponse'
    type: object
  handler.ScheduleRunResponse:
    properties:
      job_id:
        type: string
    type: object
  jobs.EntityProgress:
    properties:
      done:
        type: integer
      entity:
        type: string
      failed:
        type: integer
      percent:
        type: number
      processed:
        type: integer
      skipped:
        type: integer
      total:
        type: integer
    type: object
  jobs.GenerateParams:
    properties:
      batch_size:
        type: integer
      customers:
        type: integer
      max_items:
        type: integer
      min_items:
        type: integer
      orders:
        type: integer
      products:
        type: integer
      reset:
        type: boolean
      seed:
        type: integer
      skip_if_exists:
        type: boolean
    type: object
  jobs.JobStatus:
    properties:
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      progress:
        $ref: '#/definitions/jobs.Progress'
      running:
        type: boolean
      started_at:
        type: string
      status:
        $ref: '#/definitions/jobs.Status'
      type:
        type: string
    type: object
  jobs.MigrateParams:
    properties:
      batch_size:
        type: integer
      entities:
        items:
          type: string
        type: array
      extract_size:
        type: integer
      fail_fast:
        type: boolean
      strict_totals:
        type: boolean
      workers:
        type: integer
    type: object
  jobs.Progress:
    properties:
      entities:
        items:
          $ref: '#/definitions/jobs.EntityProgress'
        type: array
      failed:
        type: integer
      job_id:
        type: string
      job_type:
        type: string
      percent:
        type: number
      processed:
        type: integer
      skipped:
        type: integer
      status:
        $ref: '#/definitions/jobs.Status'
    type: object
  jobs.Status:
    enum:
    - pending
    - running
    - completed
    - failed
    - stopped
    - idle
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusCompleted
    - StatusFailed
    - StatusStopped
    - StatusIdle
  models.AnalyticsSummary:
    properties:
      average_order_value:
        type: number
      orders_by_status:
        items:
          $ref: '#/definitions/models.OrderStatusCount'
        type: array
      total_customers:
        type: integer
      total_orders:
        type: integer
      total_products:
        type: integer
      total_revenue:
        type: number
    type: object
  models.CronSchedule:
    properties:
      command:
        type: string
      created_at:
        type: string
      cron_expr:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      updated_at:
        type: string
    type: object
  models.Customer:
    properties:
      city:
        type: string
      country_code:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      state:
        type: string
    type: object
  models.Order:
    properties:
      currency:
        type: string
      customer:
        $ref: '#/definitions/models.Customer'
      customer_id:
        type: string
      id:
        type: string
      order_date:
        type: string
      order_items:
        items:
          $ref: '#/definitions/models.OrderItem'
        type: array
      order_number:
        type: string
      shipping_address:
        type: object
      status:
        type: string
      total_amount:
        type: number
    type: object
  models.OrderItem:
    properties:
      id:
        type: integer
      order:
        $ref: '#/definitions/models.Order'
      order_id:
        type: string
      product:
        $ref: '#/definitions/models.Product'
      product_id:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
      unit_price:
        type: number
    type: object
  models.OrderStatusCount:
    properties:
      count:
        type: integer
      status:
        type: string
    type: object
  models.Product:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      status:
        type: string
      stock:
        type: integer
    type: object
  models.User:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
      updated_at:
        type: string
    type: object
  models.UserRole:
    enum:
    - admin
    - operator
    - viewer
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleOperator
    - RoleViewer
  scheduler.CreateParams:
    properties:
      command:
        type: string
      cron_expr:
        type: string
      enabled:
        description: Enabled defaults to true when omitted.
        type: boolean
      name:
        type: string
    required:
    - command
    - cron_expr
    - name
    type: object
  scheduler.UpdateParams:
    properties:
      command:
        type: string
      cron_expr:
        type: string
      enabled:
        type: boolean
      name:
        type: string
    required:
    - command
    - cron_expr
    - name
    type: object
  service.AdminEntityCounts:
    properties:
      customers:
        type: integer
      order_items:
        type: integer
      orders:
        type: integer
      products:
        type: integer
    type: object
  service.AdminJobCounts:
    properties:
      by_status:
        additionalProperties:
          format: int64
          type: integer
        type: object
      total:
        type: integer
    type: object
  service.AdminScheduleCounts:
    properties:
      enabled:
        type: integer
      total:
        type: integer
    type: object
  service.AdminServerInfo:
    properties:
      go_version:
        type: string
      started_at:
        type: string
      uptime_seconds:
        type: integer
    type: object
  service.AdminStatsSnapshot:
    properties:
      jobs:
        $ref: '#/definitions/service.AdminJobCounts'
      schedules:
        $ref: '#/definitions/service.AdminScheduleCounts'
      server:
        $ref: '#/definitions/service.AdminServerInfo'
      source:
        $ref: '#/definitions/service.AdminEntityCounts'
      target:
        $ref: '#/definitions/service.AdminEntityCounts'
      users:
        $ref: '#/definitions/service.AdminStatsUsers'
    type: object
  service.AdminStatsUsers:
    properties:
      active:
        type: integer
      by_role:
        additionalProperties:
          format: int64
          type: integer
        type: object
      total:
        type: integer
    type: object
  service.AdminUserCreateInput:
    properties:
      active:
        description: Active defaults to true when omitted.
        type: boolean
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - operator
        - viewer
        type: string
    required:
    - email
    - password
    - role
    type: object
  service.AdminUserUpdateInput:
    properties:
      active:
        type: boolean
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - operator
        - viewer
        type: string
    type: object
  service.CustomerInput:
    properties:
      city:
        type: string
      country_code:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      state:
        type: string
    required:
    - city
    - country_code
    - email
    - first_name
    - last_name
    type: object
  service.OrderUpdateInput:
    properties:
      currency:
        type: string
      order_date:
        type: string
      shipping_address:
        type: object
      status:
        type: string
    type: object
  service.ProductInput:
    properties:
      category:
        type: string
      name:
        type: string
      price:
        minimum: 0
        type: number
      sku:
        type: string
      status:
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - category
    - name
    - sku
    type: object
info:
  contact: {}
  description: |-
    REST API for the Go Concurrent Data Processing Lab, a concurrent data processing and synthetic e-commerce analytics platform.
    All `id` and `*_id` values are opaque ids (tokens of the form `v1.<base64url>`): responses seal them and requests must send them back sealed. Raw UUIDs are rejected with 400 validation_failed. The only exception is the numeric `order_items.id`, which is also returned as a token string.
  title: Go Concurrent Data Processing Lab API
  version: "1.0"
paths:
  /admin/logs/errors:
    get:
      description: Error-level records from the rotating JSON log (ERROR/FATAL/PANIC),
        newest first. The file tail is scanned so the cost stays bounded on large
        logs.
      parameters:
      - description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page (max 100)
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List recent application error logs
      tags:
      - admin
  /admin/stats:
    get:
      description: Row counts of both lab schemas, user/job/schedule aggregates and
        process metadata. Empty tables report 0, never null.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminStatsEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Admin dashboard counters
      tags:
      - admin
  /admin/users:
    get:
      description: Returns a page of users (never the password hash). `q` matches
        the email case-insensitively, `role` filters by RBAC role and `active` by
        account state.
      parameters:
      - description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page (max 100)
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      - description: Email search (case-insensitive)
        in: query
        name: q
        type: string
      - description: RBAC role
        enum:
        - admin
        - operator
        - viewer
        in: query
        name: role
        type: string
      - description: Account state
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminUserListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List application users
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Creates a user with an Argon2id password hash. Email is normalized
        to lower-case and must be unique (409 on duplicates); password must be at
        least 8 characters and role must be admin, operator or viewer.
      parameters:
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.AdminUserCreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.AdminUserEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create an application user
      tags:
      - admin
  /admin/users/{id}:
    delete:
      description: Hard-deletes a user. An admin can neither delete themselves nor
        the last active admin (409).
      parameters:
      - description: User id (opaque token)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Delete an application user
      tags:
      - admin
    get:
      description: Returns a single user by opaque id. The password hash is never
        serialized.
      parameters:
      - description: User id (opaque token)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminUserEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get an application user
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: 'Partially updates a user: every field is optional and nil means
        unchanged. A provided password is a reset (hashed with Argon2id). An empty
        payload is rejected with 400 "no changes". Admins can neither disable nor
        demote themselves (409), and the last active admin can be neither disabled
        nor demoted (409).'
      parameters:
      - description: User id (opaque token)
        in: path
        name: id
        required: true
        type: string
      - description: User patch payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.AdminUserUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminUserEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update an application user
      tags:
      - admin
  /health:
    get:
      description: Liveness/readiness probe reporting status, time and build version.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - health
  /jobs/events:
    get:
      description: 'Streams job progress as Server-Sent Events. Each frame is `event:
        progress` followed by `data: <jobs.Progress JSON>`; `job_id` is an opaque
        v1.* token. A `: ping` comment heartbeat is sent every ~20s while idle. The
        stream closes when the job finishes (completed/failed/stopped) or the client
        disconnects. Because the browser EventSource API cannot set headers, the access
        token is passed as the `?token=` query parameter; refresh tokens are rejected
        with 401.'
      parameters:
      - description: JWT access token (EventSource cannot send an Authorization header)
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Live job progress (Server-Sent Events)
      tags:
      - jobs
  /jobs/generate/start:
    post:
      consumes:
      - application/json
      description: Launches synthetic data generation into lab_source. Only one job
        may run at a time.
      parameters:
      - description: Generation parameters (defaults applied when omitted)
        in: body
        name: request
        schema:
          $ref: '#/definitions/jobs.GenerateParams'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.JobStartEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Start a data generation job
      tags:
      - jobs
  /jobs/history:
    get:
      description: Paginated job executions from lab_target, newest first.
      parameters:
      - description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page (max 100)
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Job execution history
      tags:
      - jobs
  /jobs/migrate/start:
    post:
      consumes:
      - application/json
      description: Launches the lab_source -> lab_target migration. Only one job may
        run at a time.
      parameters:
      - description: Migration parameters (defaults applied when omitted)
        in: body
        name: request
        schema:
          $ref: '#/definitions/jobs.MigrateParams'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.JobStartEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Start an ETL migration job
      tags:
      - jobs
  /jobs/progress:
    get:
      description: Returns per-entity progress, overall percent and processed/failed
        counters.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.JobProgressEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Real-time job progress
      tags:
      - jobs
  /jobs/status:
    get:
      description: Returns the snapshot of the current (or last) job, or an idle status.
      produces:
      - application/json
      responses:
